name: kernel tests

# make check on every push and pull request: the documentation check, the
# unit tests on both CPU models and 1 to 8 CPUs, and every scenario target.
# QEMU runs without KVM here as on a developer's machine (software
# emulation), only slower, hence the generous time limit.

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential xorriso qemu-system-x86 python3 dosfstools e2fsprogs
      - name: Build with warnings as failures
        run: |
          set -o pipefail
          make -j"$(nproc)" iso 2>&1 | tee build.log
          ! grep -q 'warning:' build.log
      - name: Unit tests, low-memory scenarios and fuzzing on both CPU models
        run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs
          path: |
            build-test/*.log
            build/*.log
