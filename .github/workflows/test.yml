name: kernel tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools and QEMU
        run: sudo apt-get update && sudo apt-get install -y build-essential xorriso qemu-system-x86
      - name: Build with warnings as failures
        run: |
          make -j"$(nproc)" iso 2>&1 | tee build.log
          ! grep -q 'warning:' build.log
      - name: Run in-kernel unit tests
        run: make test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log
          path: build-test/test.log
