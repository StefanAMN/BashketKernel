# Limine's boot menu (see Limine's CONFIG.md). Two entries for one kernel:
# the system, and the same kernel with its own shell on the console instead
# of /bin/init's login prompt, for development. The build makes a second
# image (BashketKernel-dev.iso) that starts the second entry at once.
timeout: 3

/BashketOS
    protocol: limine
    kernel_path: boot():/kernel.elf
    module_path: boot():/initrd.tar
    kaslr: no

/BashketOS with the kernel shell (development)
    protocol: limine
    kernel_path: boot():/kernel.elf
    module_path: boot():/initrd.tar
    kaslr: no
    cmdline: shell
